name: Deploy static content to Pages

on:
  # Se déclenche lors d'un push sur la branche main
  push:
    branches: ["main"]

  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

# Fixe les permissions pour le déploiement sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'annuler les déploiements en cours si on fait plusieurs push d'affilée
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Travail de déploiement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        working-directory: ./client
        run: npm install
        
      - name: Build project
        working-directory: ./client
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
